<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فخ المستوى | لعبة المنصات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">

    <header class="hud">
      <span id="level-name"></span>
      <span>الموت: <b id="deaths">0</b></span>
      <span>التوكنات: <b id="tokens">0</b></span>
      <span>عملات الجولة: <b id="pending">0</b></span>
    </header>

    <div class="canvas-box">
      <canvas id="game" width="800" height="450"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <button id="ov-btn" class="btn"></button>
      </div>
    </div>

    <div class="controls">
      <button class="touch" data-key="left" aria-label="يسار">◀</button>
      <button class="touch" data-key="jump" aria-label="قفز">⤒</button>
      <button class="touch" data-key="right" aria-label="يمين">▶</button>
    </div>

    <button id="shop-toggle" class="btn btn-outline">المتجر والشخصيات</button>

    <section id="shop" class="shop hidden">
      <h2>اختر شخصيتك</h2>
      <p>تحصل على توكن عند إنهاء كل مستوى، وعلى توكن إضافي عن كل عملة تجمعها.</p>
      <div id="skins" class="skins"></div>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
